[project]
name = "chiron-scanners"
version = "0.1.0"
description = "Live, re-runnable security + inefficiency scanners for Chiron (real static analysis + API probes, run fresh each time)."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
chiron-vulnscan = "scanners.cli:vuln_main"
chiron-ineffscan = "scanners.cli:ineff_main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["scanners"]
