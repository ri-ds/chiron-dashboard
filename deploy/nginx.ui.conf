# Chiron UI (nginx) for the docker-compose stack.
# Serves the built React app and proxies every backend path to the `api` service.
# Mounted over /etc/nginx/conf.d/default.conf at runtime (see docker-compose.yml),
# so the UI repo's own Dockerfile/nginx.conf is left untouched.
server {
    listen 8000;
    server_name localhost;

    root /usr/share/nginx/html;
    charset utf-8;
    index index.html;

    client_body_buffer_size 100M;
    proxy_read_timeout 120;
    proxy_connect_timeout 120;
    proxy_send_timeout 120;

    gzip on;
    gzip_proxied any;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript application/xml text/javascript;
    gzip_vary on;

    access_log /dev/stdout;

    # Everything the frontend expects Django to serve. A variable upstream + the
    # Docker embedded DNS resolver means a RESTARTED api container (e.g. from the
    # dashboard's Stop/Start) is re-resolved instead of pinned to a stale IP.
    location ~ ^/(api|admin|accounts|backend|ajax|static)(/|$) {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $chiron_api api;
        proxy_pass http://$chiron_api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # SPA fallback — serve index.html for client-side routes.
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/mime.types;
        try_files $uri $uri/ /index.html?/$request_uri;
    }
}
