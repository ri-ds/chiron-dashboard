[project]
name = "chiron-validator"
version = "0.1.0"
description = "A database of type validations for Chiron's public API — checks live responses field-by-field against expected schemas derived from Chiron's serializers/models."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.26,<3",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
chiron-validator = "chiron_validator.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["chiron_validator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
